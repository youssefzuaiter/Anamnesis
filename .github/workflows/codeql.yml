name: CodeQL

# Static analysis of the TypeScript for the classes of bug a review can miss (injection, unsafe regular expressions, path handling, secrets in code).
# Free on a public repository. Results appear under Security → Code scanning. It runs on every pull request to main, on main itself, and weekly,
# since the rules are updated even when the code is not.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
